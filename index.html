<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Predykcja przychodu filmu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" />
    
    
    <style>
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Predykcja przychodu filmu</h2>
    <p>Sprawdź jaki będzie przewidywany przychód filmu.</p>
    <div class="mb-3">
        <label for="budget" class="form-label">Budżet</label>
        <input type="email" class="form-control" id="budget" placeholder="200 000 000">
    </div>
    <div class="mb-3">
        <label for="popularity" class="form-label">Popularność</label>
        <input type="email" class="form-control" id="popularity" placeholder="123.456789">
    </div>
    <div class="mb-3">
        <label for="vote_average" class="form-label">Ocena</label>
        <input type="email" class="form-control" id="vote_average" placeholder="od 0 do 10">
    </div>
    <div class="mb-3">
        <label for="vote_count" class="form-label">Liczba głosów</label>
        <input type="email" class="form-control" id="vote_count" placeholder="1600">
    </div>
    <button class="btn btn-primary mt-2" onclick="predict()">Oblicz</button>

    <div id="result"></div>
</div>

<script>
async function predict() {
    const budget = Number(document.getElementById("budget").value);
    const popularity = Number(document.getElementById("popularity").value);
    const vote_average = Number(document.getElementById("vote_average").value);
    const vote_count = Number(document.getElementById("vote_count").value);

    const response = await fetch("https://biometryczne-systemy-rozpoznawania-ssks.onrender.com/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            budget: budget,
            popularity: popularity,
            vote_average: vote_average,
            vote_count: vote_count,
            budget_log: Math.log1p(budget),
            popularity_log: Math.log1p(popularity)
        })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        "Przewidywany przychód: " + Math.round(data.prediction) + " $";
}
</script>

</body>
</html>
